# The catalog isn't a package — this file just declares dev tooling for CI/local.
[project]
name = "minder-plugins-catalog"
version = "0.0.0"
description = "The Minder plugin catalog (not a distributable package)."
requires-python = ">=3.11"

# Not a distributable package — the plugin dirs are the content, not modules to
# build. Tell setuptools there's nothing to package (else it errors on multiple
# top-level packages in a flat layout). `pip install -e ".[dev]"` then just
# installs the dev tooling below.
[tool.setuptools]
packages = []
py-modules = []

[project.optional-dependencies]
dev = [
    # Pinned past v0.1.0 to a specific commit (not a new tag -- this repo's
    # own CHANGELOG: no routine version bumps pre-1.0). f44873fc is plugin-sdk
    # #50 (tool effect classes): the AI_TOOLS `effect`, `idempotent`,
    # per-argument `sensitivity` and `hosts` fields, which `minder-plugin
    # validate` checks (errors on invalid values, warnings on a missing or
    # contradicted effect). It builds on plugin-sdk #43 (platform context,
    # contract v2: self.ctx / bind_context, the CONTRACT_VERSION / MANAGES /
    # EGRESS / TIMESERIES declarations, FakePlatformContext) and still carries
    # the package-style plugin validate/inspect fix `network` needs (#26).
    "minder-plugin-sdk @ git+https://github.com/minderhq/plugin-sdk@f44873fcada50f17cc38d26089837d4d1a6227ec",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pytest>=8",
    # network's tests exercise async lifecycle/sink methods directly (ported
    # verbatim from minderhq/minder, same `async def test_...` convention as
    # its own suite -- see asyncio_mode below).
    "pytest-asyncio>=0.24",
    "black>=24",
    "flake8>=7",
    "tefas-crawler>=0.3",
    "mypy>=1.8",
    # network's postgres sink (lazy `import asyncpg` at call time, so the
    # plugin still loads/registers without it -- only that one sink's tests
    # need it installed).
    "asyncpg>=0.29",
]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
# The catalog is a flat layout (each plugin is a top-level dir, not an installed
# package — see [tool.setuptools] above), and CI runs bare `pytest`, which does
# NOT put the repo root on sys.path. Without this, `import arxiv` / `import
# crypto` / … fail at collection ("No module named …"). pythonpath adds the repo
# root so the plugin dirs import directly.
pythonpath = ["."]
# network/telegraf's tests use bare `async def test_...` (no
# @pytest.mark.asyncio) -- matches minderhq/minder's own convention they
# were ported from.
asyncio_mode = "auto"
