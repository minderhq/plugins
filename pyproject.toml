# The catalog isn't a package — this file just declares dev tooling for CI/local.
[project]
name = "minder-plugins-catalog"
version = "0.0.0"
description = "The Minder plugin catalog (not a distributable package)."
requires-python = ">=3.11"

# Not a distributable package — the plugin dirs are the content, not modules to
# build. Tell setuptools there's nothing to package (else it errors on multiple
# top-level packages in a flat layout). `pip install -e ".[dev]"` then just
# installs the dev tooling below.
[tool.setuptools]
packages = []
py-modules = []

[project.optional-dependencies]
dev = [
    "minder-plugin-sdk @ git+https://github.com/minderhq/plugin-sdk",
    "httpx>=0.27",
    "pytest>=8",
    "black>=24",
    "flake8>=7",
    "mypy>=1.8",
]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^tests/"]
