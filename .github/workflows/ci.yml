name: CI

on:
  push:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Shared lint -> type-check -> test pipeline (always GitHub-hosted):
    # minderhq/.github/.github/workflows/python-ci.yml. Repo-specific checks
    # that need the installed environment are passed in below.
    uses: minderhq/.github/.github/workflows/python-ci.yml@main
    with:
      # Contract-validate every catalog plugin dir before the test suite.
      pre-test-run: |
        for d in */ ; do
          name="${d%/}"
          case "$name" in tests|.github) continue;; esac
          [ -f "$name/__init__.py" ] || continue
          echo "── validate $name ──"
          minder-plugin validate "$name/__init__.py"
        done

  security:
    name: Security Gates
    # Catalog plugins run IN-PROCESS inside minder's plugin-registry, so a
    # community PR adding subprocess/eval/stdlib XML is a core compromise.
    # All three gates below are blocking.
    # GitHub-hosted only: public repo, fork PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Plugin AST policy
        # stdlib-only; bans subprocess / os.system+exec+spawn / eval+exec+
        # compile+__import__ / stdlib xml / pickle+marshal loads. Escape hatch
        # and rule list: scripts/check_plugin_policy.py.
        run: python scripts/check_plugin_policy.py

      - name: Install scanners
        # Pinned so a scanner release can't silently change what fails.
        run: uv pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Bandit (fail on HIGH severity)
        run: bandit -r . -x ./tests --severity-level high -q

      - name: pip-audit (fail on known CVEs)
        # Resolve pyproject's dev extra (everything CI/plugins pull in) to a
        # fully pinned set, then audit exactly that set. The git-pinned
        # minder-plugin-sdk has no PyPI version and is reported as skipped.
        run: |
          uv pip compile pyproject.toml --extra dev -q -o "$RUNNER_TEMP/requirements.txt"
          pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

  secrets-scan:
    name: Secrets Scan
    # push (trusted, post-merge) runs on the org's self-hosted pool; pull_request
    # (including from forks -- this repo is public) stays on GitHub-hosted, same
    # split as `validate` above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # Pinned to a specific SHA, not a mutable branch/tag -- see minderhq/minder's
        # quality.yml Secrets Scan job for the incident (CVE-2026-33634) that
        # motivated this.
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          # github.event.before only exists on `push` payloads, not `pull_request`
          # ones -- use the PR's own base SHA there instead (matches minderhq/minder's
          # quality.yml fix for the same gotcha: omitting this falls back to scanning
          # full repo history on every PR run instead of just the incremental diff).
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
