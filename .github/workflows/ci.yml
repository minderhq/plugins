name: CI

on:
  push:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Always GitHub-hosted: this public repo's self-hosted push CI queued behind
    # the org runner group's allows_public_repositories=false gate and never ran.
    # Hosted is free for public repos; fork PRs already ran hosted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify system Python
        # Self-hosted runner (Debian 13/trixie): actions/setup-python has no
        # hosted-tool-cache build for this distro -- only python3.13 is
        # installed persistently (mirrors minderhq/minder's ci.yml fix for
        # the same gap).
        if: github.event_name == 'push'
        run: python3 --version

      - name: Set up uv
        # SHA-pinned (org convention since the TruffleHog CVE-2026-33634
        # incident). Pull requests pin 3.12 via UV_PYTHON (uv fetches a managed
        # build); push passes none, so uv uses the runner's python3.
        # activate-environment creates a venv (outside the checkout, so
        # black/flake8/mypy never scan it) and puts it on PATH for later steps
        # -- `uv pip install` needs a venv rather than the system interpreter.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ github.event_name != 'push' && '3.12' || '' }}
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - run: uv pip install -e ".[dev]"
      - name: Lint
        run: |
          black --check .
          flake8 --max-line-length=100 --extend-ignore=E203,W503 --exclude=.git .
      - name: Type-check
        # Parity with plugin-sdk's CI — the SDK ships py.typed, so catalog
        # plugins (which authors copy as references) get type-checked too.
        run: mypy .
      - name: Validate every plugin against the contract
        run: |
          # each catalog plugin dir must pass `minder-plugin validate`
          for d in */ ; do
            name="${d%/}"
            case "$name" in tests|.github) continue;; esac
            [ -f "$name/__init__.py" ] || continue
            echo "── validate $name ──"
            minder-plugin validate "$name/__init__.py"
          done
      - name: Test the whole catalog
        run: pytest -q

  secrets-scan:
    name: Secrets Scan
    # push (trusted, post-merge) runs on the org's self-hosted pool; pull_request
    # (including from forks -- this repo is public) stays on GitHub-hosted, same
    # split as `validate` above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # Pinned to a specific SHA, not a mutable branch/tag -- see minderhq/minder's
        # quality.yml Secrets Scan job for the incident (CVE-2026-33634) that
        # motivated this.
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          # github.event.before only exists on `push` payloads, not `pull_request`
          # ones -- use the PR's own base SHA there instead (matches minderhq/minder's
          # quality.yml fix for the same gotcha: omitting this falls back to scanning
          # full repo history on every PR run instead of just the incremental diff).
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
